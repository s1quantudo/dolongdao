name: Build DolongDAO Native APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-extract zip if uploaded as DolongDAO_Native_Android.zip
        run: |
          if [ -f "DolongDAO_Native_Android.zip" ]; then
            unzip -o DolongDAO_Native_Android.zip
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Native APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare DolongDAO-Native.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DolongDAO-Native.apk
          ls -lh DolongDAO-Native.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DolongDAO-Native-APK
          path: DolongDAO-Native.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DolongDAO Native APK (Bản #${{ github.run_number }})"
          body: "Bấm trực tiếp vào file DolongDAO-Native.apk bên dưới để tải về điện thoại và cài đặt."
          files: DolongDAO-Native.apk
